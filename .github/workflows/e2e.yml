# PARTAMBUS - pipeline test otomatis
#
# Jalan setiap push ke main, setiap pull request, setiap malam (02:00 WIB),
# dan bisa dijalankan manual dari tab Actions ("Run workflow").
#
#   1. lint        : typecheck (tsc), ESLint, Prettier
#   2. e2e         : build app + MariaDB lewat Docker, Playwright dibagi 2 shard
#   3. report      : gabungkan hasil shard -> satu HTML report (artifact "playwright-report")
#   4. pages       : publikasikan report ke GitHub Pages
#                    (hanya saat push ke main, jika repo PUBLIK dan Pages sudah diaktifkan: Settings > Pages > Source: GitHub Actions)

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 19 * * *' # 19:00 UTC = 02:00 WIB
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: e2e

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Jalankan aplikasi + database (Docker)
        working-directory: .
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Jalankan Playwright
        run: npx playwright test --shard=${{ matrix.shard }}/2 --reporter=blob

      - name: Log aplikasi (jika gagal)
        if: failure()
        working-directory: .
        run: docker compose logs --tail=200

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 7

  report:
    name: Gabungkan report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Buat HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        with:
          path: e2e/playwright-report

  pages:
    name: Publikasikan report
    needs: report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
