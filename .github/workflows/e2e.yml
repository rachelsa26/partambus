# PARTAMBUS - pipeline test otomatis
#
# Jalan setiap push ke main, setiap pull request, setiap Minggu (19:00 WIB),
# dan bisa dijalankan manual dari tab Actions ("Run workflow").
#
#   1. lint        : typecheck (tsc), ESLint, Prettier
#   2. e2e         : build app + MariaDB lewat Docker, Playwright dibagi 2 shard
#   3. api         : Postman collection dijalankan Newman terhadap app di Docker (artifact "api-report")
#      db          : setelah test API dan tiap shard UI, query SQL memeriksa integritas data yang
#                    baru dibuat (db-tests/). Constraint database dicek sekali di job API.
#   4. report      : - gabungkan shard Playwright -> satu HTML report (artifact "playwright-report")
#                    - gabungkan hasil UI + API + DB + performa -> satu Allure dashboard (artifact "allure-report")
#                    - susun semuanya jadi satu situs dengan halaman depan (artifact "qa-report-site")
#   5. pages       : publikasikan situs report ke GitHub Pages: halaman depan ringkasan (root),
#                    Allure (/allure), Playwright (/playwright), Newman (/api), k6 (/perf)
#                    (push ke main, jadwal mingguan, atau Run workflow; jika repo PUBLIK dan Pages sudah diaktifkan: Settings > Pages > Source: GitHub Actions)

name: QA Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 12 * * 0' # Minggu 12:00 UTC = Minggu 19:00 WIB
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: e2e

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6

      - name: Jalankan aplikasi + database (Docker)
        working-directory: .
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Jalankan Playwright
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Test database (SQL) setelah test UI
        if: ${{ !cancelled() }}
        working-directory: db-tests
        env:
          DB_RUN_LABEL: setelah test UI (shard ${{ matrix.shard }})
          DB_SUITES: integrity
        run: |
          npm ci
          npm test

      - name: Log aplikasi (jika gagal)
        if: failure()
        working-directory: .
        run: docker compose logs --tail=200

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-results-db-ui-${{ matrix.shard }}
          path: db-tests/allure-results
          retention-days: 7

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 7

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-results-ui-${{ matrix.shard }}
          path: e2e/allure-results
          retention-days: 7

  api:
    name: API + performa smoke (Newman, k6)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api-tests
    steps:
      - uses: actions/checkout@v6

      - name: Jalankan aplikasi + database (Docker)
        working-directory: .
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-tests/package-lock.json
      - run: npm ci

      - name: Jalankan Postman collection
        run: npm test -- --env-var baseUrl=http://127.0.0.1:8080

      - name: Pasang k6
        if: ${{ !cancelled() }}
        uses: grafana/setup-k6-action@v1

      # Hanya smoke dan race test (masing-masing sekitar 15 detik). Load/stress test tidak dijalankan di CI:
      # mesin GitHub dipakai bersama, jadi angkanya tidak bisa dijadikan patokan.
      - name: Smoke test performa (k6)
        if: ${{ !cancelled() }}
        working-directory: perf-tests
        run: npm run smoke

      # 30 kasir membayar bersamaan untuk stok tersisa 10: harus tepat 10 terjual.
      - name: Race condition checkout serentak (k6)
        if: ${{ !cancelled() }}
        working-directory: perf-tests
        run: npm run race

      - name: Test database (SQL) setelah test API + performa
        if: ${{ !cancelled() }}
        working-directory: db-tests
        env:
          DB_RUN_LABEL: setelah test API + performa
        run: |
          npm ci
          npm test

      - name: Log aplikasi (jika gagal)
        if: failure()
        working-directory: .
        run: docker compose logs --tail=200

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: api-report
          path: api-tests/reports
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-results-api
          path: api-tests/allure-results
          retention-days: 7

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-results-perf
          path: perf-tests/allure-results
          retention-days: 7

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: perf-report
          path: perf-tests/reports
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: allure-results-db-api
          path: db-tests/allure-results
          retention-days: 7

  report:
    name: Gabungkan report
    needs: [e2e, api]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          path: e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Buat HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - uses: actions/download-artifact@v7
        with:
          path: e2e/all-allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Buat Allure dashboard (UI + API + DB + Performa)
        run: npx allure generate all-allure-results --output allure-report

      - uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: e2e/allure-report
          retention-days: 14

      - uses: actions/download-artifact@v7
        continue-on-error: true # kalau job API gagal total, situs tetap dibuat tanpa bagian ini
        with:
          name: api-report
          path: e2e/api-report

      - uses: actions/download-artifact@v7
        continue-on-error: true # kalau job API gagal total, situs tetap dibuat tanpa bagian ini
        with:
          name: perf-report
          path: e2e/perf-report

      # Halaman depan + Allure (/allure) + Playwright (/playwright) + Newman (/api) + k6 (/perf)
      - name: Susun situs report
        run: node scripts/build-site.mjs

      - uses: actions/upload-artifact@v6
        with:
          name: qa-report-site
          path: e2e/site
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        with:
          path: e2e/site

  pages:
    name: Publikasikan report
    needs: report
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
